name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with MCP server extra
        run: pip install -e '.[mcp-server]' pyyaml pytest

      - name: Verify packaged MCP server installation
        run: |
          pip install build
          python -m build --wheel
          pip uninstall -y agent-security-harness
          wheel=$(find dist -name '*.whl' -print -quit)
          pip install "${wheel}[mcp-server]"
          python -c "from mcp_server.server import create_server; assert create_server().name == 'Agent Security Harness'"

      - name: Verify CLI
        run: |
          agent-security --help
          agent-security version
          agent-security list

      - name: Verify all modules import
        run: |
          python -c "
          import protocol_tests.mcp_harness
          import protocol_tests.a2a_harness
          import protocol_tests.l402_harness
          import protocol_tests.x402_harness
          import protocol_tests.enterprise_adapters
          import protocol_tests.extended_enterprise_adapters
          import protocol_tests.framework_adapters
          import protocol_tests.identity_harness
          import protocol_tests.gtg1002_simulation
          import protocol_tests.advanced_attacks
          import protocol_tests.over_refusal_harness
          import protocol_tests.provenance_harness
          import protocol_tests.jailbreak_harness
          import protocol_tests.return_channel_harness
          import protocol_tests.capability_profile_harness
          import protocol_tests.delegation_chain_harness
          import protocol_tests.harmful_output_harness
          import protocol_tests.cbrn_harness
          import protocol_tests.incident_response_harness
          import protocol_tests.mcp_tool_poisoning_harness
          import protocol_tests.aiuc1_compliance_harness
          import protocol_tests.cloud_agent_harness
          import protocol_tests.statistical
          import protocol_tests.cli
          import mcp_server.server
          import protocol_tests.kill_switch_harness
          import protocol_tests.watermark_harness
          import protocol_tests.memory_harness
          import protocol_tests.multi_agent_harness
          import protocol_tests.autogen_harness
          import protocol_tests.intent_contract_harness
          import protocol_tests.crewai_cve_harness
          import protocol_tests.benchmark_integrity_harness
          import protocol_tests.governance_modification_harness
          import protocol_tests.skill_security_harness
          import protocol_tests.community_runner
          import scripts.auroc
          import scripts.compliance_crosswalk
          import scripts.fria_evidence
          import scripts.compliance_report
          print('All 37 modules import successfully')
          "

      - name: Run pytest
        run: |
          # cryptography and jsonschema are optional at run time and required
          # here: without them the registry signature and schema-validity tests
          # importorskip, and a skipped contract test is a contract nothing checks.
          pip install pytest pyyaml cryptography jsonschema
          python -m pytest tests/ -v --tb=short

      - name: Verify all harness --list commands
        run: |
          agent-security list mcp
          agent-security list a2a
          agent-security list l402
          agent-security list x402
          agent-security list enterprise
          agent-security list framework
          agent-security list identity
          agent-security list gtg1002
          agent-security list advanced
          agent-security list mcp-tool-poisoning
          agent-security list aiuc1
          agent-security list cloud-agents

      - name: Run self-tests
        if: hashFiles('testing/') != ''
        run: |
          pip install pytest cryptography jsonschema
          python -m pytest testing/ -v --tb=short

  # Fourth external review (2026-09-08, R4-16): the pinned reference-server
  # calibration skips when the npm cache lacks the package, and a skip reads
  # green. This job populates the cache with the exact pin the script declares,
  # proves the server launches offline, and then fails on ANY skip. A skipped
  # calibration is UNMEASURED, and unmeasured is not clean.
  mcp-reference-calibration:
    name: MCP reference-server calibration (pinned, non-skippable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: pip install -e . pyyaml pytest

      # The pin is read from the one place it is declared, so this step cannot
      # drift from the script; test_the_pin_is_a_fixed_version refuses a
      # floating tag there.
      - name: Populate the npm cache with the exact pinned reference server
        run: |
          set -euo pipefail
          pin=$(python -c "from scripts.mcp_reference_calibration import REFERENCE_SERVER; print(REFERENCE_SERVER)")
          case "$pin" in
            @modelcontextprotocol/server-everything@20[0-9][0-9].[0-9]*.[0-9]*) echo "pin: $pin" ;;
            *) echo "::error::REFERENCE_SERVER is not the pinned package: $pin"; exit 1 ;;
          esac
          npx -y -p "$pin" -c true
          echo "$pin" > "$RUNNER_TEMP/reference-server.pin"

      - name: Prove the pinned server launches offline
        run: |
          set -euo pipefail
          pin=$(cat "$RUNNER_TEMP/reference-server.pin")
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' > "$RUNNER_TEMP/init.json"
          timeout 30 npx --offline -y "$pin" stdio < "$RUNNER_TEMP/init.json" > "$RUNNER_TEMP/init.out" 2> "$RUNNER_TEMP/init.err" || true
          grep -q '"serverInfo"' "$RUNNER_TEMP/init.out" || {
            echo "::error::the pinned server did not answer initialize offline"
            cat "$RUNNER_TEMP/init.err"; exit 1; }
          head -c 200 "$RUNNER_TEMP/init.out"; echo

      - name: Run the calibration and fail on any skip
        run: |
          set -euo pipefail
          python -m pytest testing/test_mcp_reference_calibration.py \
            -p no:cacheprovider -rs -v --tb=short \
            --junitxml="$RUNNER_TEMP/calibration.xml"
          if grep -q '<skipped' "$RUNNER_TEMP/calibration.xml"; then
            echo "::error::the reference calibration reported a skip: UNMEASURED, not clean"
            grep -o '<skipped[^>]*>' "$RUNNER_TEMP/calibration.xml"
            exit 1
          fi
          ran=$(grep -o '<testcase ' "$RUNNER_TEMP/calibration.xml" | wc -l)
          echo "testcases run: $ran"
          [ "$ran" -ge 5 ] || { echo "::error::expected at least 5 calibration testcases, saw $ran"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Syntax check all modules
        run: |
          python -m py_compile protocol_tests/cli.py
          python -m py_compile protocol_tests/mcp_harness.py
          python -m py_compile protocol_tests/a2a_harness.py
          python -m py_compile protocol_tests/l402_harness.py
          python -m py_compile protocol_tests/x402_harness.py
          python -m py_compile protocol_tests/enterprise_adapters.py
          python -m py_compile protocol_tests/extended_enterprise_adapters.py
          python -m py_compile protocol_tests/framework_adapters.py
          python -m py_compile protocol_tests/identity_harness.py
          python -m py_compile protocol_tests/delegation_chain_harness.py
          python -m py_compile protocol_tests/gtg1002_simulation.py
          python -m py_compile protocol_tests/advanced_attacks.py
          python -m py_compile protocol_tests/statistical.py
          python -m py_compile protocol_tests/kill_switch_harness.py
          python -m py_compile protocol_tests/watermark_harness.py
          python -m py_compile scripts/auroc.py
          python -m py_compile scripts/compliance_crosswalk.py
          python -m py_compile scripts/fria_evidence.py
          python -m py_compile scripts/compliance_report.py
          echo "All modules pass syntax check"

      - name: Undefined-name check (ruff F821)
        # py_compile only checks syntax; it does not catch a name used but never bound
        # (e.g. an undefined variable in a verdict's non-simulate path). F821 does, and
        # such a bug is a NameError at runtime on exactly the live paths CI cannot exercise.
        run: |
          pip install ruff
          ruff check --select F821 protocol_tests/ testing/ scripts/ mcp_server/

      - name: Check for unique test IDs
        run: |
          python -c "
          import re, sys
          from pathlib import Path
          # Check that each test ID is only defined in ONE test method across all harnesses.
          # IDs can appear multiple times in the same method (error branch + success branch).
          method_ids = {}  # {test_id: set of (file, method_name)}
          for f in Path('protocol_tests').glob('*.py'):
              content = f.read_text()
              # Split into methods and find test_id assignments per method
              for match in re.finditer(r'def (test_\w+)\(self\)(.*?)(?=\n    def |\Z)', content, re.DOTALL):
                  method_name = match.group(1)
                  method_body = match.group(2)
                  ids_in_method = set(re.findall(r'test_id=[\"\\']([A-Z][A-Z0-9]*-[A-Z0-9]{3,}[a-z]?)[\"\\']', method_body))
                  for tid in ids_in_method:
                      if tid not in method_ids:
                          method_ids[tid] = set()
                      method_ids[tid].add((f.name, method_name))
          dupes = {k: v for k, v in method_ids.items() if len(v) > 1}
          if dupes:
              print(f'DUPLICATE TEST IDS (used in multiple methods):')
              for tid, locations in dupes.items():
                  print(f'  {tid}: {locations}')
              sys.exit(1)
          print(f'All {len(method_ids)} test IDs are unique across methods')
          "

  owasp-coverage:
    name: OWASP Agentic v1.1 coverage mapping
    runs-on: ubuntu-latest
    steps:
      # Full history on purpose. The report pins every evidence permalink to the
      # assessed commit, and test_assessed_commit_is_reachable_from_head verifies
      # that commit is an ancestor of HEAD. Under the default fetch-depth: 1 the
      # history does not exist, the test skips, and a report full of dead links
      # would ship green. This is the one job where that check must really run.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pytest

      # Spec 3.4: fail when a mapped test id no longer exists, a module path is
      # wrong, a threat entry is missing, a direct entry has no executable
      # evidence, metadata is absent, counts are hand-entered, or the canonical
      # test count disagrees.
      - name: Validate the coverage mapping
        run: python scripts/validate_owasp_agentic_mapping.py

      # Spec 3.4: fail when the committed report differs from generated output.
      # The validator already checks this; regenerating proves it is idempotent
      # and that the generator itself still runs.
      - name: Reports are reproducible from the mapping
        run: |
          python scripts/generate_owasp_agentic_coverage.py
          git diff --exit-code -- docs/OWASP-AGENTIC-V1.1-COVERAGE.md \
                                  docs/OWASP-AGENTIC-T1-T15-SUBMISSION-COVERAGE.md \
                                  docs/OWASP-ASI-TOP10-CROSSWALK.md \
                                  docs/coverage/owasp-agentic-v1.1.json

      - name: Coverage mapping tests
        run: python -m pytest tests/test_owasp_agentic_mapping.py -q
