name: Public metadata drift

# The GitHub description, the two remote READMEs and CITATION.cff are claims
# about the latest published RELEASE, not about main, so this checks out the
# latest release tag before comparing. Running against main would fail every
# time main is legitimately ahead.
#
# The checker itself had to survive that checkout while the latest release
# predated it. It was added after v4.15.0, so it did not exist at that tag, and
# the first version of this workflow would have failed its first scheduled run
# with a file-not-found.
#
# v4.16.0 (2026-08-30) is the first release that contains it, so the workaround
# expired. The copy-out-copy-back is gone and the checkout is plain.
#
# testing/test_public_metadata_check.py asserted the premise -- "the checker is
# absent from the latest release tag" -- and failed the moment it stopped being
# true, which is how this was noticed rather than left in place for years. A
# workaround that outlives its reason is indistinguishable from a design.

on:
  release:
    types: [published]
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description-matches-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the latest release tag
        run: |
          TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$TAG" ]; then
            echo "No release tag found; nothing to compare a release-facing claim against."
            exit 0
          fi
          echo "Comparing against $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git checkout -q "$TAG"

      # Kept after the preserve step was removed. A release older than v4.16.0
      # does not carry the checker, so a tag that predates it -- a retroactive
      # tag, or a revert of the newest release -- still needs to say so clearly
      # rather than fail with a file-not-found further down.
      - name: Verify the checker exists at the tag
        run: |
          test -f scripts/check_public_metadata.py \
            || { echo "::error::$TAG predates scripts/check_public_metadata.py (added after v4.15.0); nothing to run"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare public claims against the tree at ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_public_metadata.py --repo "${{ github.repository }}"
