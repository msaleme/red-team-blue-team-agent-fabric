name: Agent Security Scan

on:
  workflow_call:
    inputs:
      target_url:
        description: 'MCP server URL to test'
        required: true
        type: string
      transport:
        description: 'Transport type: http or stdio'
        required: false
        type: string
        default: 'http'
      categories:
        description: 'Comma-separated test categories (optional)'
        required: false
        type: string
        default: ''
      fail_on:
        description: 'Fail threshold: any, critical, or none'
        required: false
        type: string
        default: 'critical'
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'
      harness_version:
        description: 'agent-security-harness PyPI version (empty for latest)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  security-scan:
    name: Agent Security Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install agent-security-harness
        run: |
          if [ -n "$HARNESS_VERSION" ]; then
            pip install "agent-security-harness==${HARNESS_VERSION}"
          else
            pip install agent-security-harness
          fi
        env:
          HARNESS_VERSION: ${{ inputs.harness_version }}

      - name: Run security harness
        id: harness
        run: |
          REPORT_FILE="security-report.json"
          CMD="python -m protocol_tests.mcp_harness --transport ${INPUT_TRANSPORT} --url ${INPUT_TARGET_URL} --report ${REPORT_FILE}"

          if [ -n "$INPUT_CATEGORIES" ]; then
            CMD="${CMD} --categories ${INPUT_CATEGORIES}"
          fi

          echo "Running: ${CMD}"
          ${CMD} || true
          echo "report_path=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          INPUT_TRANSPORT: ${{ inputs.transport }}
          INPUT_CATEGORIES: ${{ inputs.categories }}

      - name: Parse and summarize results
        id: results
        # protocol_tests.report_gate from the installed harness: the same
        # row classification (http_helpers.row_outcome) the harness's own
        # summary counts with. A reusable workflow has no checkout of this
        # repository to import it from, so a harness_version older than the
        # gate cannot be counted correctly; that fails closed below.
        run: |
          if ! python3 -c "import protocol_tests.report_gate" 2>/dev/null; then
            echo "::error::The installed agent-security-harness has no protocol_tests.report_gate, so its report cannot be counted correctly (critical failures would read as 0). Use a harness_version that includes it, or the composite action."
            echo "gate_available=false" >> "$GITHUB_OUTPUT"
            [ "${INPUT_FAIL_ON}" = "none" ] && exit 0
            exit 1
          fi
          echo "gate_available=true" >> "$GITHUB_OUTPUT"
          python3 -m protocol_tests.report_gate summarize "${REPORT_PATH}" --summary-file security-summary.md
        env:
          REPORT_PATH: ${{ steps.harness.outputs.report_path }}
          INPUT_FAIL_ON: ${{ inputs.fail_on }}

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && hashFiles('security-summary.md') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            const body = summary + '\n\n---\n*Posted by [Agent Security Harness](https://github.com/msaleme/red-team-blue-team-agent-fabric)*';

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = 'Posted by [Agent Security Harness]';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-report
          path: ${{ steps.harness.outputs.report_path }}
          retention-days: 30

      - name: Evaluate threshold
        if: steps.results.outputs.gate_available == 'true'
        run: |
          python3 -m protocol_tests.report_gate gate "${REPORT_PATH}" --fail-on "${INPUT_FAIL_ON}"
        env:
          INPUT_FAIL_ON: ${{ inputs.fail_on }}
          REPORT_PATH: ${{ steps.harness.outputs.report_path }}
