name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for trusted publishing (PyPI OIDC)

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # A clean-room execution review (2026-08-28) reported two advisories against
      # the setuptools present in a build environment, and noted that a release
      # pipeline should use a patched build environment and record it. `pip install
      # build` resolved whatever was current, and nothing recorded what that was.
      #
      # setuptools is this package's build backend (see pyproject.toml
      # build-system), so its version governs the artifact that ships. 79.0.1
      # carries GHSA-h35f-9h28-mq5c and PYSEC-2026-3447, both fixed in 83.0.0,
      # confirmed against OSV rather than taken from the report.
      #
      # Scope, honestly: GHSA-h35f-9h28-mq5c is a MANIFEST.in exclusion bypass in
      # sdist. This repository has no MANIFEST.in, so that mechanism had nothing to
      # bypass here. This is build hygiene and provenance, not the closing of a live
      # exploit path, and should not be described as one.
      - name: Install build tools
        run: pip install "build>=1.3.0" "setuptools>=83.0.0" "wheel>=0.45.0"

      - name: Record the build environment
        run: |
          {
            echo "# Build environment for $GITHUB_REF_NAME"
            echo "commit:   $GITHUB_SHA"
            echo "ref:      $GITHUB_REF_NAME"
            echo "runner:   $RUNNER_OS $(uname -m)"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "python:   $(python -VV | tr '\n' ' ')"
            echo "---"
            pip freeze
          } > build-environment.txt
          cat build-environment.txt

      - name: Fail if the build backend is a version with known advisories
        run: |
          # A recorded environment that nobody checks is a log, not a control.
          python - <<'EOF'
          import sys
          from importlib.metadata import version
          v = version("setuptools")
          parts = [int(p) for p in v.split(".")[:1] if p.isdigit()]
          if not parts or parts[0] < 83:
              sys.exit(f"setuptools {v} is below the 83.0.0 floor "
                       f"(GHSA-h35f-9h28-mq5c, PYSEC-2026-3447)")
          print(f"setuptools {v} meets the floor")
          EOF

      - name: Build package
        run: python -m build

      # Two artifacts, not one path list. upload-artifact@v4 roots a multi-path
      # artifact at the least common ancestor of its paths, so `dist/` plus a
      # file at the workspace root produced an artifact containing
      # `dist/<wheel>` AND `build-environment.txt`. Downloading that into
      # `path: dist/` yields `dist/dist/<wheel>` and `dist/build-environment.txt`,
      # and twine then reports
      #
      #     no Python distribution packages to publish in the directory 'dist/'
      #     Checking dist/build-environment.txt: InvalidDistribution
      #
      # which is exactly how v4.16.0 failed to publish on 2026-08-30.
      #
      # The recording step landed 2026-08-28 and every publish before it
      # succeeded, so this workflow shipped broken and stayed broken through one
      # release. It only runs on `release: published`, so no push, no PR and no
      # scheduled job could have exercised it. Infrequent automation is
      # unverified automation.
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

      - name: Upload the build-environment record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-environment
          path: build-environment.txt

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-security-harness
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # A malformed dist/ made twine emit a WARNING and then fail on the first
      # non-distribution file it met. Assert the positive expected set instead,
      # so the next shape of this defect names itself rather than arriving as an
      # InvalidDistribution on an unrelated filename.
      - name: Assert dist/ holds exactly the distributions
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl); sdists=(dist/*.tar.gz)
          others=()
          for f in dist/*; do
            case "$f" in *.whl|*.tar.gz) ;; *) others+=("$f") ;; esac
          done
          echo "wheels: ${#wheels[@]}  sdists: ${#sdists[@]}  other: ${#others[@]}"
          ls -la dist/
          [ "${#wheels[@]}" -ge 1 ] || { echo "::error::no wheel in dist/"; exit 1; }
          [ "${#sdists[@]}" -ge 1 ] || { echo "::error::no sdist in dist/"; exit 1; }
          if [ "${#others[@]}" -gt 0 ]; then
            echo "::error::dist/ contains non-distribution files: ${others[*]}"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0 # Docker-based action requires tag ref, not SHA
        # Uses trusted publishing (OIDC) - no API token needed
        # Configure at: https://pypi.org/manage/project/agent-security-harness/settings/publishing/
        with:
          # Make the publish idempotent. A Release whose version is already on
          # PyPI otherwise fails the job on "file already exists", which is a
          # red run on a green history for a no-op upload.
          #
          # This is not hypothetical: 4.10.0 reached PyPI on 2026-07-25 when the
          # dgb-v1.0.0 Release fired this workflow against a main tree already
          # bumped to 4.10.0. Cutting the matching v4.10.0 Release afterwards
          # would re-upload an existing version and fail. Same hazard applies to
          # any retroactive tag, re-published Release, or re-run of this job.
          skip-existing: true
