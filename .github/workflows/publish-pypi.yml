name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write       # attach the artifacts and the statement to the Release
  id-token: write       # trusted publishing (PyPI OIDC) and Sigstore attestation
  attestations: write   # actions/attest-build-provenance

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # A clean-room execution review (2026-08-28) reported two advisories against
      # the setuptools present in a build environment, and noted that a release
      # pipeline should use a patched build environment and record it. `pip install
      # build` resolved whatever was current, and nothing recorded what that was.
      #
      # setuptools is this package's build backend (see pyproject.toml
      # build-system), so its version governs the artifact that ships. 79.0.1
      # carries GHSA-h35f-9h28-mq5c and PYSEC-2026-3447, both fixed in 83.0.0,
      # confirmed against OSV rather than taken from the report.
      #
      # Scope, honestly: GHSA-h35f-9h28-mq5c is a MANIFEST.in exclusion bypass in
      # sdist. This repository has no MANIFEST.in, so that mechanism had nothing to
      # bypass here. This is build hygiene and provenance, not the closing of a live
      # exploit path, and should not be described as one.
      - name: Install build tools
        run: pip install "build>=1.3.0" "setuptools>=83.0.0" "wheel>=0.45.0"

      - name: Record the build environment
        run: |
          {
            echo "# Build environment for $GITHUB_REF_NAME"
            echo "commit:   $GITHUB_SHA"
            echo "ref:      $GITHUB_REF_NAME"
            echo "runner:   $RUNNER_OS $(uname -m)"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "python:   $(python -VV | tr '\n' ' ')"
            echo "---"
            pip freeze
          } > build-environment.txt
          cat build-environment.txt

      - name: Fail if the build backend is a version with known advisories
        run: |
          # A recorded environment that nobody checks is a log, not a control.
          python - <<'EOF'
          import sys
          from importlib.metadata import version
          v = version("setuptools")
          parts = [int(p) for p in v.split(".")[:1] if p.isdigit()]
          if not parts or parts[0] < 83:
              sys.exit(f"setuptools {v} is below the 83.0.0 floor "
                       f"(GHSA-h35f-9h28-mq5c, PYSEC-2026-3447)")
          print(f"setuptools {v} meets the floor")
          EOF

      - name: Build package
        run: python -m build

      # Two independent reviews of v4.17.0 reached the same finding by different
      # routes: the release was content-strong and identity-weak. A reviewer
      # rebuilt from the exact tag and matched all 95 files inside both wheels,
      # which establishes correspondence to the tagged source and nothing about
      # who built it. The tag is annotated and unsigned; the Release carried no
      # assets, so there was nothing release-attached to check.
      #
      # Two separate claims are made here and they should not be conflated:
      #   the STATEMENT below binds digests to a commit, tag, run and toolchain;
      #   the ATTESTATION signs those digests against this workflow's identity.
      # A statement on its own is a text file anyone could write.
      - name: Write the provenance statement
        run: |
          python scripts/build_provenance.py --dist dist/ --out provenance.json
          cat provenance.json

      - name: Attest the built artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*"

      # A statement nobody checks is a log, not a control -- the same argument
      # this workflow already applied to the recorded build environment. This
      # runs the checks that do not need PyPI; the digest comparison runs after
      # publish, when there is something published to compare against.
      - name: Verify the statement before publishing
        run: python scripts/verify_release_provenance.py --provenance provenance.json --offline

      # Two artifacts, not one path list. upload-artifact@v4 roots a multi-path
      # artifact at the least common ancestor of its paths, so `dist/` plus a
      # file at the workspace root produced an artifact containing
      # `dist/<wheel>` AND `build-environment.txt`. Downloading that into
      # `path: dist/` yields `dist/dist/<wheel>` and `dist/build-environment.txt`,
      # and twine then reports
      #
      #     no Python distribution packages to publish in the directory 'dist/'
      #     Checking dist/build-environment.txt: InvalidDistribution
      #
      # which is exactly how v4.16.0 failed to publish on 2026-08-30.
      #
      # The recording step landed 2026-08-28 and every publish before it
      # succeeded, so this workflow shipped broken and stayed broken through one
      # release. It only runs on `release: published`, so no push, no PR and no
      # scheduled job could have exercised it. Infrequent automation is
      # unverified automation.
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

      - name: Upload the build-environment record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-environment
          path: build-environment.txt

      - name: Upload the provenance statement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance
          path: provenance.json

  # Fourth external review (2026-09-08, R4-16): publish depended on `build`
  # and on nothing that had run a test against the artifact being published.
  # CI is a separate push/PR workflow, and its install check runs inside the
  # checkout, where `import protocol_tests` can resolve to the source tree
  # instead of the installed wheel. Provenance and OIDC establish who built
  # the wheel; neither establishes that it works. This job installs the exact
  # wheel the publish job uploads, into a fresh venv, from a directory that is
  # NOT the checkout, and runs it there.
  # Fifth external review (2026-09-09, R5-01/R5-07): this job's checks lived in
  # shell here, and the regression file that guarded them searched that shell
  # for phrases. Wrapping every `run:` step in `if false; then … fi` left every
  # phrase in place, executed nothing, and all 15 tests still passed. The
  # checks now live in `scripts/verify_wheel_gate.py`, which this job runs
  # against the installed wheel and which
  # `testing/test_release_is_gated_on_the_wheel.py` runs against deliberately
  # bad artifacts. One implementation, two callers, and neither can pass by
  # containing the right words.
  test-wheel:
    name: Test the built wheel from a neutral directory
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The checkout is here for tests/ and for the gate script, and nothing
      # else. No step below runs with the checkout as its working directory,
      # and the gate refuses to run next to a source tree.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download the built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # An sdist-only build leaves nothing to install and so nothing to test;
      # a stray file in dist/ is how v4.16.0 failed to publish on 2026-08-30.
      - name: The built artifact is one wheel and one sdist and nothing else
        run: python "$GITHUB_WORKSPACE/scripts/verify_wheel_gate.py" dist-shape --dist "$GITHUB_WORKSPACE/dist"

      - name: Install the wheel into a fresh venv, outside the checkout
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected one wheel, found ${#wheels[@]}"; exit 1; }
          cd "$RUNNER_TEMP"
          python -m venv wheel-venv
          # The mcp-server extra is installed on purpose: without it the three
          # MCP server/SDK boundary contracts collect-error in a neutral
          # directory, and a file that cannot be collected is not a file that
          # was excluded for needing the checkout.
          ./wheel-venv/bin/pip install -q "${wheels[0]}[mcp-server]" \
            pytest pytest-subtests pyyaml cryptography jsonschema

      # Everything the gate asserts, executed by the venv's interpreter from a
      # directory with no source tree in it: that the imports resolve to
      # site-packages, that the documented entry points run, that a payment
      # harness against a closed port passes nothing (R3-01), that the six
      # native `--simulate` entry points the CLI facade never reaches publish
      # no pass anywhere a row is read (R4-05, and R5-07's escape from it), and
      # that every file in tests/ behaves as it is classified.
      #
      # The gate script comes from the checkout, not from the wheel: a wheel
      # that ships a broken gate would otherwise certify itself.
      - name: Run the release gate against the installed wheel
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neutral"
          cp -r "$GITHUB_WORKSPACE/tests" "$RUNNER_TEMP/neutral/tests"
          cd "$RUNNER_TEMP/neutral"
          "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/verify_wheel_gate.py" verify --tests tests

  # Fifth external review, section E: "a release from a tag with no green
  # ordinary CI can still enter this release workflow; the wheel gate must
  # pass, but the separate CI calibration is not a dependency of publish."
  # That was true. `needs:` cannot cross workflows, and CI fires on push and
  # pull_request, so a Release cut from any ref reached `publish` without the
  # pinned reference-server calibration ever having run on that ref. This job
  # is the same calibration, in the release graph, so the dependency is real
  # rather than assumed from branch protection nobody verified.
  #
  # The two copies are held identical by
  # `test_the_release_calibration_is_the_same_job_as_the_ci_one`; a divergent
  # copy is worse than none, because it reads as coverage.
  calibration:
    name: MCP reference-server calibration (pinned, non-skippable)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: pip install -e . pyyaml pytest

      - name: Populate the npm cache with the exact pinned reference server
        run: |
          set -euo pipefail
          pin=$(python -c "from scripts.mcp_reference_calibration import REFERENCE_SERVER; print(REFERENCE_SERVER)")
          case "$pin" in
            @modelcontextprotocol/server-everything@20[0-9][0-9].[0-9]*.[0-9]*) echo "pin: $pin" ;;
            *) echo "::error::REFERENCE_SERVER is not the pinned package: $pin"; exit 1 ;;
          esac
          npx -y -p "$pin" -c true
          echo "$pin" > "$RUNNER_TEMP/reference-server.pin"

      - name: Prove the pinned server launches offline
        run: |
          set -euo pipefail
          pin=$(cat "$RUNNER_TEMP/reference-server.pin")
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' > "$RUNNER_TEMP/init.json"
          timeout 30 npx --offline -y "$pin" stdio < "$RUNNER_TEMP/init.json" > "$RUNNER_TEMP/init.out" 2> "$RUNNER_TEMP/init.err" || true
          grep -q '"serverInfo"' "$RUNNER_TEMP/init.out" || {
            echo "::error::the pinned server did not answer initialize offline"
            cat "$RUNNER_TEMP/init.err"; exit 1; }
          head -c 200 "$RUNNER_TEMP/init.out"; echo

      - name: Run the calibration and fail on any skip
        run: |
          set -euo pipefail
          python -m pytest testing/test_mcp_reference_calibration.py \
            -p no:cacheprovider -rs -v --tb=short \
            --junitxml="$RUNNER_TEMP/calibration.xml"
          if grep -q '<skipped' "$RUNNER_TEMP/calibration.xml"; then
            echo "::error::the reference calibration reported a skip: UNMEASURED, not clean"
            grep -o '<skipped[^>]*>' "$RUNNER_TEMP/calibration.xml"
            exit 1
          fi
          ran=$(grep -o '<testcase ' "$RUNNER_TEMP/calibration.xml" | wc -l)
          echo "testcases run: $ran"
          [ "$ran" -ge 5 ] || { echo "::error::expected at least 5 calibration testcases, saw $ran"; exit 1; }

  publish:
    name: Publish to PyPI
    needs: [build, test-wheel, calibration]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-security-harness
    steps:
      # The publish job had no checkout, because nothing in it used the
      # repository. It does now -- `verify_release_provenance.py` runs here,
      # after PyPI has the files -- and a job that calls a script it never
      # fetched fails at the last step of a release, which is the worst place
      # for this workflow to fail.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # A malformed dist/ made twine emit a WARNING and then fail on the first
      # non-distribution file it met. Assert the positive expected set instead,
      # so the next shape of this defect names itself rather than arriving as an
      # InvalidDistribution on an unrelated filename.
      - name: Assert dist/ holds exactly the distributions
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl); sdists=(dist/*.tar.gz)
          others=()
          for f in dist/*; do
            case "$f" in *.whl|*.tar.gz) ;; *) others+=("$f") ;; esac
          done
          echo "wheels: ${#wheels[@]}  sdists: ${#sdists[@]}  other: ${#others[@]}"
          ls -la dist/
          [ "${#wheels[@]}" -ge 1 ] || { echo "::error::no wheel in dist/"; exit 1; }
          [ "${#sdists[@]}" -ge 1 ] || { echo "::error::no sdist in dist/"; exit 1; }
          if [ "${#others[@]}" -gt 0 ]; then
            echo "::error::dist/ contains non-distribution files: ${others[*]}"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0 # Docker-based action requires tag ref, not SHA
        # Uses trusted publishing (OIDC) - no API token needed
        # Configure at: https://pypi.org/manage/project/agent-security-harness/settings/publishing/
        with:
          # Make the publish idempotent. A Release whose version is already on
          # PyPI otherwise fails the job on "file already exists", which is a
          # red run on a green history for a no-op upload.
          #
          # This is not hypothetical: 4.10.0 reached PyPI on 2026-07-25 when the
          # dgb-v1.0.0 Release fired this workflow against a main tree already
          # bumped to 4.10.0. Cutting the matching v4.10.0 Release afterwards
          # would re-upload an existing version and fail. Same hazard applies to
          # any retroactive tag, re-published Release, or re-run of this job.
          skip-existing: true

      - name: Download the provenance statement
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: provenance

      - name: Download the build-environment record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-environment

      # The Release had no assets at all, which is why an outside reviewer had
      # nothing release-attached to verify and had to rebuild from the tag to
      # say anything. These three make the claim checkable from the Release page.
      - name: Attach the artifacts and the statement to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz provenance.json build-environment.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

      # Now PyPI has the files, so the digests can be compared against what was
      # actually published rather than against what was built. This is the check
      # the reviewer asked to be able to re-run; it now runs itself.
      - name: Verify the published artifacts against the statement
        run: |
          for attempt in 1 2 3 4 5; do
            if python scripts/verify_release_provenance.py --provenance provenance.json; then
              exit 0
            fi
            echo "::notice::PyPI has not caught up yet; retry $attempt"
            sleep 20
          done
          echo "::error::published artifacts do not match the provenance statement"
          exit 1
