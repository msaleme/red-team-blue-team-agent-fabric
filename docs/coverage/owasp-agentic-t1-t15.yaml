  - id: "T13"
    title: "Rogue Agents in Multi-Agent Systems"
    coverage: "direct"
    disposition: "in_scope"
    threat_interpretation: >-
      An unauthorised or compromised agent participates in a multi-agent system
      and is treated as a legitimate peer.
    rationale: >-
