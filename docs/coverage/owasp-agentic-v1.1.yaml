  question: Does the system rely on authentication for users, tools, services, or agents?
  threats:
  - T3
  - T9
  - T16
- step: 5
  name: Human engagement
  question: Does the agent require human engagement or directly influence a human?
  threats:
  - T10
  - T15
- step: 6
  name: Multi-agent system
  question: Does the system rely on multiple interacting agents?
  threats:
  - T12
  - T13
  - T14
