# OWASP Agentic AI v1.1 threat-coverage mapping - CANONICAL SOURCE OF TRUTH.
#
# Both reports are generated from this file:
#   docs/OWASP-AGENTIC-V1.1-COVERAGE.md              complete, T1-T17
#   docs/OWASP-AGENTIC-T1-T15-SUBMISSION-COVERAGE.md filtered to the form's T1-T15
# Never edit either by hand; CI fails if they drift.
#
# Adapted from OWASP, Agentic AI - Threats and Mitigations v1.1 (December 2025),
# used under CC BY-SA 4.0. Paraphrased and mapped to test evidence; those are
# changes from the original. OWASP has not reviewed or endorsed this report.
#
# Threat coverage and mitigation validation are SEPARATE dimensions. A test that
# shows a threat is exercisable says nothing about whether a control works.

schema_version: '2.0'
framework:
  publisher: OWASP
  project: OWASP Top 10 for LLM Apps & Gen AI - Agentic Security Initiative
  title: Agentic AI - Threats and Mitigations
  version: '1.1'
  publication_date: 2025-12
  scope: T1-T17
  source_url: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
  source_pdf: Agentic-AI-Threats-and-Mitigations-1.1.pdf
  source_sha256: 65e3bd59f99c411b055c6caf2bac96ab361dff8c010e4bef532a593ce10345ff
  source_pages: 53
  license: CC-BY-SA-4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  attribution: Threat and scenario summaries are adapted from OWASP, Agentic AI - Threats and Mitigations,
    Version 1.1 (December 2025), by the OWASP Top 10 for LLM Apps & Gen AI - Agentic Security Initiative,
    used under CC BY-SA 4.0. Text has been paraphrased, normalised and mapped to harness test evidence;
    those are changes from the original. OWASP has not reviewed, endorsed or approved this report.
  source_notes:
  - id: playbook-count
    note: The mitigation introduction states the strategies are 'organized into five playbooks', while
      the document enumerates six (Playbook 1 through Playbook 6). The six numbered playbooks are treated
      as authoritative. Confirmed verbatim in the source text.
    verified: true
  - id: example-count
    note: The published Example Threat Models section contains three scenario families - Enterprise Co-Pilots,
      Agentic IoT in Smart Home Security Cameras, and Agent-driven RPA expense reimbursement - all three
      of which are modelled here. The specification reports an introductory claim of four; that phrasing
      was NOT located in the extracted text, so the discrepancy is recorded as reported-but-unconfirmed
      rather than asserted.
    verified: false
  - id: playbook-6-step
    note: 'Playbook 6 (Securing Multi-Agent Communication & Trust Mechanisms) is labelled Step 5 in the
      source, the same step as Playbook 5, while the decision navigator places multi-agent threats at
      Step 6. Playbook 6 is modelled under Step 6 and the apparent labelling inconsistency is disclosed.
      Confirmed: both playbooks carry ''Step 5''.'
    verified: true
