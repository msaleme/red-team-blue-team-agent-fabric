name: 'Agent Security Harness'
description: 'Run protocol-level security tests against MCP/A2A/L402/x402 agent endpoints as a CI/CD gate'
author: 'msaleme'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  target_url:
    description: 'MCP server URL to test (e.g. http://localhost:8080/mcp)'
    required: true
  transport:
    description: 'Transport type: http or stdio'
    required: false
    default: 'http'
  categories:
    description: 'Comma-separated test categories to run (optional, runs all if omitted)'
    required: false
    default: ''
  fail_on:
    description: 'Fail threshold: any (fail on any test failure), critical (fail only on critical), none (never fail)'
    required: false
    default: 'critical'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  harness_version:
    description: 'agent-security-harness PyPI version (empty for latest)'
    required: false
    default: ''

outputs:
  report_path:
    description: 'Path to the JSON report file'
    value: ${{ steps.run-harness.outputs.report_path }}
  total_tests:
    description: 'Total number of tests executed'
    value: ${{ steps.parse-report.outputs.total_tests }}
  passed:
    description: 'Number of passed tests'
    value: ${{ steps.parse-report.outputs.passed }}
  failed:
    description: 'Number of failed tests (genuine FAILs; INCONCLUSIVE rows excluded)'
    value: ${{ steps.parse-report.outputs.failed }}
  critical_failures:
    description: 'Number of failed tests whose severity is critical (P0-Critical / critical)'
    value: ${{ steps.parse-report.outputs.critical_failures }}
  inconclusive:
    description: 'Number of INCONCLUSIVE / NOT_EXECUTED tests (reported, never counted as failures)'
    value: ${{ steps.parse-report.outputs.inconclusive }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install agent-security-harness
      shell: bash
      run: |
        if [ -n "$HARNESS_VERSION" ]; then
          pip install "agent-security-harness==${HARNESS_VERSION}"
        else
          pip install agent-security-harness
        fi
      env:
        HARNESS_VERSION: ${{ inputs.harness_version }}

    - name: Run security harness
      id: run-harness
      shell: bash
      run: |
        REPORT_FILE="security-report-$(date +%s).json"

        if [ -n "$INPUT_CATEGORIES" ]; then
          python -m protocol_tests.mcp_harness \
            --transport "${INPUT_TRANSPORT}" \
            --url "${INPUT_TARGET_URL}" \
            --report "${REPORT_FILE}" \
            --categories "${INPUT_CATEGORIES}" || true
        else
          python -m protocol_tests.mcp_harness \
            --transport "${INPUT_TRANSPORT}" \
            --url "${INPUT_TARGET_URL}" \
            --report "${REPORT_FILE}" || true
        fi

        echo "report_path=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
      env:
        INPUT_TARGET_URL: ${{ inputs.target_url }}
        INPUT_TRANSPORT: ${{ inputs.transport }}
        INPUT_CATEGORIES: ${{ inputs.categories }}

    - name: Parse report
      id: parse-report
      shell: bash
      # Counting is protocol_tests.report_gate, imported from this action's own
      # checkout (GITHUB_ACTION_PATH), not from the pip-installed harness, so
      # the gate matches this action ref even when harness_version pins an
      # older package. It classifies each row with http_helpers.row_outcome,
      # the function the harness's own summary counts with.
      run: |
        PYTHONPATH="${GITHUB_ACTION_PATH}" python3 -m protocol_tests.report_gate summarize "${REPORT_PATH}"
      env:
        REPORT_PATH: ${{ steps.run-harness.outputs.report_path }}

    - name: Evaluate threshold
      shell: bash
      run: |
        PYTHONPATH="${GITHUB_ACTION_PATH}" python3 -m protocol_tests.report_gate gate "${REPORT_PATH}" --fail-on "${INPUT_FAIL_ON}"
      env:
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        REPORT_PATH: ${{ steps.run-harness.outputs.report_path }}
