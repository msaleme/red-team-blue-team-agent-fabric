# AIUC-1 requirement-to-test mapping
#
# Evidence class E1 (a mapping). It names harness tests that may be relevant to collecting evidence for a
# requirement. It is not a run against any target, not a third-party evaluation, and not a claim that any
# system meets a requirement. MAPPED = relevant tests are named; GAP = no test evidences this requirement.
#
# Standard: AIUC-1 release 2026-10-15. Requirement IDs and titles are copied from the pinned snapshot
# configs/aiuc1_standard_2026-10-15.json, and tests/test_aiuc1_mapping_matches_standard.py fails if they drift.
# Rows: 23 of 50 active requirements listed; 19 with named tests. No coverage percentage is claimed.
#
# Correction (2026-10-30): earlier versions of this file put titles on AIUC-1 IDs that were not AIUC-1's
# (e.g. B003 "Protocol Downgrade Prevention"; the requirement is "Manage public release of technical
# details") and marked every row COVERED. See CHANGELOG.

version: "2.0.0"
framework: "agent-security-harness"
standard_release: "2026-10-15"
standard_snapshot: "configs/aiuc1_standard_2026-10-15.json"
evidence_class: "E1"

